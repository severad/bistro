<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generátor Poledního Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Oswald:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #f3f4f6; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        #render-canvas {
            width: 1080px; height: 1350px;
            background-color: #e4dfd6;
            position: relative; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform-origin: top center;
        }
        .canvas-header-bg {
            background-color: #d2c1b0;
            background-image: url("https://img.magnific.com/premium-photo/old-paper-texture-beige-craft-cardboard-vintage-canvas-surface_84485-1586.jpg?semt=ais_hybrid&w=740&q=80");
            background-size: cover;
            background-position: center top;
            height: 220px; width: 100%;
            position: absolute; top: 0; left: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 60px; box-sizing: border-box;
        }
        .canvas-title { font-family: 'Dancing Script', cursive; font-size: 140px; color: #1a1a1a; white-space: nowrap; line-height: 1; padding-bottom: 15px; }
        .canvas-logo { width: 180px; height: 180px; object-fit: contain; border-radius: 50%; z-index: 10; }
        .canvas-body {
            position: absolute; top: 220px; width: 100%; height: calc(1350px - 220px);
            padding: 30px 0; box-sizing: border-box;
            background-image: url("https://img.magnific.com/premium-photo/old-paper-texture-beige-craft-cardboard-vintage-canvas-surface_84485-1586.jpg?semt=ais_hybrid&w=740&q=80");
            background-size: cover;
            background-position: center bottom;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .canvas-disclaimer { text-align: center; color: #cc0000; font-size: 24px; font-family: 'Oswald', sans-serif; line-height: 1.3; margin-bottom: 20px; width: 1080px; box-sizing: border-box; }
        #canvas-days-render { width: 880px; max-width: 100%; text-align: left; }
        .day-block { margin-bottom: 18px; width: 100%; }
        .day-header { background-color: #d0bcab; display: block; width: fit-content; padding: 4px 16px; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 1px; margin-bottom: 8px; color: #111; }
        .food-item { font-size: 26px; color: #222; line-height: 1.42; display: flex; justify-content: space-between; }
        .food-soup { font-size: 26px; color: #333; margin-bottom: 2px; padding-left: 5px; }
        .food-meal { padding-left: 5px; flex: 1; }
        .food-price { font-weight: 500; text-align: right; min-width: 110px; }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 50; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">

    <header class="bg-white shadow-sm z-10 relative">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i data-lucide="chef-hat" class="text-blue-600"></i>
                    <h1 class="text-xl font-bold text-gray-900">Bistro Menu</h1>
                </div>
                <div class="flex gap-4 h-full">
                    <button onclick="switchTab('editor')" id="btn-editor" class="tab-btn active px-3 flex items-center gap-2 font-medium text-gray-500 hover:text-gray-700 transition-colors h-full">
                        <i data-lucide="edit-3" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">Editor</span>
                    </button>
                    <button onclick="switchTab('preview')" id="btn-preview" class="tab-btn px-3 flex items-center gap-2 font-medium text-gray-500 hover:text-gray-700 transition-colors h-full">
                        <i data-lucide="image" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">Náhled a Export</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-hidden relative">
        <div id="tab-editor" class="absolute inset-0 overflow-y-auto bg-gray-50 p-4 sm:p-6 lg:p-8 transition-opacity duration-300">
            <div class="max-w-2xl mx-auto space-y-6 pb-20">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-5 h-5 text-blue-500"></i>
                        Nastavení týdne
                    </h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Datum pondělí</label>
                        <input type="date" id="start-date" class="w-full sm:w-1/2 p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>
                <div id="days-container" class="space-y-4"></div>
                <div class="flex justify-between items-center pt-4">
                    <button onclick="clearData()" class="text-red-500 hover:bg-red-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Vymazat formulář
                    </button>
                    <button onclick="manualSave()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Uložit
                    </button>
                </div>
            </div>
        </div>

        <div id="tab-preview" class="absolute inset-0 overflow-y-auto bg-gray-800 p-4 opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center">
            <div class="bg-white p-3 rounded-2xl shadow-xl flex flex-wrap justify-center gap-2 sm:gap-4 mb-6 sticky top-0 z-20 w-full max-w-2xl">
                <button onclick="exportJPG()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm transition-all transform active:scale-95">
                    <i data-lucide="download" class="w-5 h-5"></i><span>Stáhnout JPG</span>
                </button>
                <button onclick="exportPDF()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2.5 rounded-xl font-medium transition-all transform active:scale-95">
                    <i data-lucide="file-text" class="w-5 h-5"></i><span>PDF</span>
                </button>
                <button onclick="shareMenu()" id="btn-share" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2.5 rounded-xl font-medium transition-all transform active:scale-95">
                    <i data-lucide="share-2" class="w-5 h-5"></i><span>Sdílet na IG</span>
                </button>
            </div>

            <div id="canvas-wrapper" class="flex justify-center items-start origin-top pb-20">
                <div id="render-canvas">
                    <div class="canvas-header-bg">
                        <div class="canvas-title">Polední menu</div>
                        <img src="logo.png" alt="Logo" class="canvas-logo" onerror="this.style.display='none'" id="logo-img">
                    </div>
                    <div class="canvas-body">
                        <div class="canvas-disclaimer">
                            Změna menu vyhrazena.<br>Seznam alergenů k dispozici u obsluhy.
                        </div>
                        <div id="canvas-days-render"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast">✅ Uloženo do prohlížeče</div>

    <script>
        lucide.createIcons();

        const DAYS = ['Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek'];
        const STORAGE_KEY = 'bistro_menu_data';

        let appState = {
            startDate: getNextMonday(),
            days: Array(5).fill(null).map(() => ({ soup: '', meal1: '', price1: '159', meal2: '', price2: '159' }))
        };

        function init() {
            loadFromStorage();
            renderEditorForms();
            setupDateListener();
            updatePreview();
            handleResize();
            window.addEventListener('resize', handleResize);
            if (!navigator.canShare) document.getElementById('btn-share').style.display = 'none';
        }

        function getNextMonday() {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff)).toISOString().split('T')[0];
        }

        function calculateDateForDay(startDateStr, dayIndex) {
            if (!startDateStr) return '';
            const date = new Date(startDateStr);
            date.setDate(date.getDate() + dayIndex);
            return `${date.getDate()}.${date.getMonth() + 1}.`;
        }

        function setupDateListener() {
            const dateInput = document.getElementById('start-date');
            dateInput.value = appState.startDate;
            dateInput.addEventListener('change', (e) => {
                appState.startDate = e.target.value;
                autoSave(); updateDayHeaders(); updatePreview();
            });
        }

        function renderEditorForms() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';
            DAYS.forEach((dayName, index) => {
                const dayData = appState.days[index];
                const dateStr = calculateDateForDay(appState.startDate, index);
                const card = document.createElement('div');
                card.className = 'bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-gray-100 transition-all focus-within:ring-2 focus-within:ring-blue-100';
                card.innerHTML = `
                    <div class="border-b border-gray-100 pb-3 mb-4 flex justify-between items-center">
                        <h3 class="font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                            <span class="w-2 h-6 bg-blue-500 rounded-full inline-block"></span>
                            ${dayName} <span class="day-date-label text-blue-600 ml-1 font-normal">${dateStr}</span>
                        </h3>
                    </div>
                    <div class="space-y-4">
                        <input type="text" placeholder="Polévka" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-800 font-medium" value="${dayData.soup}" oninput="updateState(${index},'soup',this.value)">
                        <div class="flex gap-2">
                            <input type="text" placeholder="Jídlo 1" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-700" value="${dayData.meal1}" oninput="updateState(${index},'meal1',this.value)">
                            <input type="number" placeholder="Cena" class="w-28 p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-center focus:ring-2 focus:ring-blue-500 outline-none font-medium" value="${dayData.price1}" oninput="updateState(${index},'price1',this.value)">
                        </div>
                        <div class="flex gap-2">
                            <input type="text" placeholder="Jídlo 2" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-700" value="${dayData.meal2}" oninput="updateState(${index},'meal2',this.value)">
                            <input type="number" placeholder="Cena" class="w-28 p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-center focus:ring-2 focus:ring-blue-500 outline-none font-medium" value="${dayData.price2}" oninput="updateState(${index},'price2',this.value)">
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        function updateDayHeaders() {
            document.querySelectorAll('.day-date-label').forEach((label, i) => {
                label.textContent = calculateDateForDay(appState.startDate, i);
            });
        }

        function updateState(dayIndex, field, value) {
            appState.days[dayIndex][field] = value;
            autoSave(); updatePreview();
        }

        function formatPrice(v) {
            const clean = String(v || '').replace(/[,\-\s]/g, '');
            return clean ? `${clean},-` : '';
        }

        function updatePreview() {
            const container = document.getElementById('canvas-days-render');
            container.innerHTML = '';
            appState.days.forEach((d, i) => {
                if (!d.soup && !d.meal1 && !d.meal2) return;
                const dateStr = calculateDateForDay(appState.startDate, i);
                const block = document.createElement('div');
                block.className = 'day-block';
                let html = `<div class="day-header">${DAYS[i].toUpperCase()} ${dateStr}</div>`;
                if (d.soup) html += `<div class="food-soup">${d.soup}</div>`;
                if (d.meal1) html += `<div class="food-item"><div class="food-meal">1) ${d.meal1}</div><div class="food-price">${formatPrice(d.price1)}</div></div>`;
                if (d.meal2) html += `<div class="food-item"><div class="food-meal">2) ${d.meal2}</div><div class="food-price">${formatPrice(d.price2)}</div></div>`;
                block.innerHTML = html;
                container.appendChild(block);
            });
        }

        let saveTimeout;
        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)), 500);
        }

        function loadFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                    appState.days.forEach(day => {
                        if (day.price1) day.price1 = String(day.price1).replace(/[,\-\s]/g, '');
                        if (day.price2) day.price2 = String(day.price2).replace(/[,\-\s]/g, '');
                    });
                } catch(e) {}
            }
        }

        function manualSave() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); showToast(); }

        function clearData() {
            appState.days = Array(5).fill(null).map(() => ({ soup:'', meal1:'', price1:'159', meal2:'', price2:'159' }));
            renderEditorForms(); updatePreview(); autoSave(); showToast("Formulář vymazán");
        }

        function showToast(msg = "✅ Uloženo do prohlížeče") {
            const toast = document.getElementById("toast");
            toast.innerText = msg; toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function switchTab(tabName) {
            const editorTab = document.getElementById('tab-editor');
            const previewTab = document.getElementById('tab-preview');
            const btnEditor = document.getElementById('btn-editor');
            const btnPreview = document.getElementById('btn-preview');
            if (tabName === 'editor') {
                editorTab.style.opacity='1'; editorTab.style.pointerEvents='auto';
                previewTab.style.opacity='0'; previewTab.style.pointerEvents='none';
                btnEditor.classList.add('active'); btnPreview.classList.remove('active');
            } else {
                editorTab.style.opacity='0'; editorTab.style.pointerEvents='none';
                previewTab.style.opacity='1'; previewTab.style.pointerEvents='auto';
                btnEditor.classList.remove('active'); btnPreview.classList.add('active');
                document.fonts.ready.then(() => handleResize());
            }
        }

        function handleResize() {
            const canvas = document.getElementById('render-canvas');
            const wrapper = document.getElementById('canvas-wrapper');
            const containerWidth = wrapper.parentElement.clientWidth - 32;
            let scale = Math.min(1, Math.max(0.2, containerWidth / 1080));
            canvas.style.transform = `scale(${scale})`;
            wrapper.style.height = `${1350 * scale}px`;
        }

        // ============================================================
        // EXPORT: čisté kreslení na <canvas> přes Canvas 2D API
        // Žádné DOM zachytávání — vše nakreslíme přímo kódem.
        // ============================================================

        // Generuje texturu papíru přímo na canvasu — žádné externí soubory
        function drawPaperTexture(ctx, x, y, w, h, seed) {
            // Náhodný generátor se seedem pro konzistentní výsledky
            let s = seed || 42;
            function rnd() { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; }

            ctx.save();
            ctx.globalCompositeOperation = 'multiply'; // tmavší vlákna zesilují barvu pod nimi

            // 1. Jemná zrnitost — tisíce náhodných semi-transparentních teček
            for (let i = 0; i < 18000; i++) {
                const px = x + rnd() * w;
                const py = y + rnd() * h;
                const alpha = rnd() * 0.055;
                const gray = Math.floor(rnd() * 80 + 120); // 120–200, béžové tóny
                ctx.fillStyle = `rgba(${gray},${Math.floor(gray*0.85)},${Math.floor(gray*0.72)},${alpha})`;
                ctx.fillRect(px, py, 1.2, 1.2);
            }

            // 2. Papírová vlákna — krátké vodorovné tahy
            for (let i = 0; i < 2200; i++) {
                const px = x + rnd() * w;
                const py = y + rnd() * h;
                const len = rnd() * 38 + 6;
                const alpha = rnd() * 0.04;
                const tone = Math.floor(rnd() * 40 + 100);
                ctx.strokeStyle = `rgba(${tone},${Math.floor(tone*0.82)},${Math.floor(tone*0.68)},${alpha})`;
                ctx.lineWidth = rnd() * 0.8 + 0.3;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px + len, py + (rnd() - 0.5) * 1.5);
                ctx.stroke();
            }

            // 3. Lehké světlejší flíčky — variace v tónu papíru
            for (let i = 0; i < 320; i++) {
                const px = x + rnd() * w;
                const py = y + rnd() * h;
                const r = rnd() * 22 + 4;
                const alpha = rnd() * 0.025;
                ctx.fillStyle = `rgba(255,245,230,${alpha})`;
                ctx.beginPath();
                ctx.ellipse(px, py, r, r * (0.4 + rnd() * 0.6), rnd() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();
        }

        async function drawMenuToCanvas() {
            const W = 1080, H = 1350;
            const c = document.createElement('canvas');
            c.width = W; c.height = H;
            const ctx = c.getContext('2d');

            await document.fonts.ready;

            // Načteme texturový obrázek papíru
            const paperImg = await new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null); // fallback pokud se nenačte
                img.src = 'https://img.magnific.com/premium-photo/old-paper-texture-beige-craft-cardboard-vintage-canvas-surface_84485-1586.jpg?semt=ais_hybrid&w=740&q=80';
            });

            if (paperImg) {
                // Natáhneme obrázek přes celý canvas (1080×1350)
                ctx.drawImage(paperImg, 0, 0, W, H);
                // Lehký ztmavující overlay pro header oblast — aby byl vizuálně oddělený
                ctx.fillStyle = 'rgba(180, 155, 130, 0.35)';
                ctx.fillRect(0, 0, W, 220);
            } else {
                // Fallback: gradient jako dříve
                ctx.fillStyle = '#d2c1b0';
                ctx.fillRect(0, 0, W, 220);
                const grad = ctx.createRadialGradient(W/2, 220 + (H-220)/2, 0, W/2, 220 + (H-220)/2, W*0.75);
                grad.addColorStop(0, '#eee9e0');
                grad.addColorStop(1, '#d8d2c5');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 220, W, H - 220);
            }

            // --- LOGO ---
            const logoImg = document.getElementById('logo-img');
            if (logoImg && logoImg.complete && logoImg.naturalWidth > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(W - 60 - 90, 110, 90, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(logoImg, W - 60 - 180, 20, 180, 180);
                ctx.restore();
            }

            // --- NADPIS "Polední menu" ---
            ctx.fillStyle = '#1a1a1a';
            ctx.font = '700 125px "Dancing Script"';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('Polední menu', 60, 172);

            // --- DISCLAIMER ---
            ctx.fillStyle = '#cc0000';
            ctx.font = '400 24px "Oswald"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('Změna menu vyhrazena.', 540, 242);
            ctx.fillText('Seznam alergenů k dispozici u obsluhy.', 540, 273);

            // --- DNY ---
            const LEFT = 100;
            const RIGHT = W - 100;

            let y = 338;

            // Fonty o trochu menší než předchozí verze — vše se vejde
            const FONT_SIZE    = 26;
            const LINE_H       = 37;
            const BLOCK_GAP    = 18;
            const HEADER_SIZE  = 28;
            const HEADER_H     = 40;
            const HEADER_PAD_H = 16;

            appState.days.forEach((d, i) => {
                if (!d.soup && !d.meal1 && !d.meal2) return;

                const dateStr = calculateDateForDay(appState.startDate, i);
                const dayLabel = `${DAYS[i].toUpperCase()} ${dateStr}`;

                // Záhlaví dne
                ctx.font = `700 ${HEADER_SIZE}px "Oswald"`;
                const headerW = ctx.measureText(dayLabel).width + HEADER_PAD_H * 2;
                ctx.fillStyle = '#d0bcab';
                ctx.fillRect(LEFT, y, headerW, HEADER_H);
                ctx.fillStyle = '#111111';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(dayLabel, LEFT + HEADER_PAD_H, y + HEADER_H / 2 + 2);
                y += HEADER_H + 10;

                // Polévka
                if (d.soup) {
                    ctx.font = `400 ${FONT_SIZE}px "Roboto"`;
                    ctx.fillStyle = '#333333';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(d.soup, LEFT + 5, y);
                    y += LINE_H;
                }

                // Jídlo 1
                if (d.meal1) {
                    ctx.font = `400 ${FONT_SIZE}px "Roboto"`;
                    ctx.fillStyle = '#222222';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(`1) ${d.meal1}`, LEFT + 5, y);
                    if (d.price1) {
                        ctx.font = `500 ${FONT_SIZE}px "Roboto"`;
                        ctx.textAlign = 'right';
                        ctx.fillText(formatPrice(d.price1), RIGHT, y);
                    }
                    y += LINE_H;
                }

                // Jídlo 2
                if (d.meal2) {
                    ctx.font = `400 ${FONT_SIZE}px "Roboto"`;
                    ctx.fillStyle = '#222222';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(`2) ${d.meal2}`, LEFT + 5, y);
                    if (d.price2) {
                        ctx.font = `500 ${FONT_SIZE}px "Roboto"`;
                        ctx.textAlign = 'right';
                        ctx.fillText(formatPrice(d.price2), RIGHT, y);
                    }
                    y += LINE_H;
                }

                y += BLOCK_GAP;
            });

            return c;
        }

        async function exportJPG() {
            showToast("⏳ Generuji obrázek...");
            try {
                const canvas = await drawMenuToCanvas();
                const link = document.createElement('a');
                link.download = `menu-${appState.startDate}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            } catch(e) {
                console.error(e);
                showToast("❌ Chyba při exportu JPG");
            }
        }

        async function exportPDF() {
            showToast("⏳ Generuji PDF...");
            try {
                const canvas = await drawMenuToCanvas();
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation:'portrait', unit:'px', format:[canvas.width, canvas.height] });
                pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
                pdf.save(`menu-${appState.startDate}.pdf`);
            } catch(e) {
                console.error(e);
                showToast("❌ Chyba při exportu PDF");
            }
        }

        async function shareMenu() {
            showToast("⏳ Připravuji obrázek...");
            try {
                const canvas = await drawMenuToCanvas();
                canvas.toBlob(async (blob) => {
                    if (!blob) { showToast("❌ Chyba"); return; }
                    const file = new File([blob], `menu-${appState.startDate}.jpg`, { type:'image/jpeg' });
                    if (navigator.canShare && navigator.canShare({ files:[file] })) {
                        try {
                            await navigator.share({ files:[file], title:'Polední menu', text:'Naše polední menu na tento týden!' });
                        } catch(e) {
                            if (e.name !== 'AbortError') showToast("❌ Sdílení se nezdařilo");
                        }
                    } else {
                        showToast("❌ Prohlížeč nepodporuje sdílení. Stáhněte JPG.");
                    }
                }, 'image/jpeg', 0.95);
            } catch(e) {
                console.error(e);
                showToast("❌ Chyba při sdílení");
            }
        }

        init();
    </script>
</body>
</html>
