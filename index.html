<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generátor Poledního Menu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Oswald:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- html2canvas and jsPDF for exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Fixed Canvas Container representing 1080x1350 (Instagram Portrait 4:5) */
        #render-canvas {
            width: 1080px;
            height: 1350px;
            background-color: #e4dfd6; /* Light grey/beige texture base */
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform-origin: top center;
            /* Důležité pro správný export při zmenšení */
            will-change: transform; 
        }

        /* Header Area */
        .canvas-header-bg {
            background-color: #d2c1b0;
            height: 220px; /* Zmenšeno pro více místa dole */
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between; /* Nadpis vlevo, logo vpravo */
            align-items: center;
            padding: 0 60px;
            box-sizing: border-box;
        }

        /* Title */
        .canvas-title {
            font-family: 'Dancing Script', cursive;
            font-size: 140px;
            color: #1a1a1a;
            white-space: nowrap;
            line-height: 1;
            padding-bottom: 15px; /* Optické vertikální vycentrování fontu */
        }

        .canvas-logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 50%;
            z-index: 10;
        }

        /* Body Area */
        .canvas-body {
            position: absolute;
            top: 220px;
            width: 100%;
            height: calc(1350px - 220px);
            padding: 30px 0; /* Zmenšeno odsazení nahoře */
            box-sizing: border-box;
            background: radial-gradient(circle at center, #ece9e2 0%, #ded9ce 100%);
            display: flex; /* Pro vycentrování obsahu */
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .canvas-disclaimer {
            text-align: center;
            color: #cc0000;
            font-size: 22px; /* Lehce zmenšeno */
            font-family: 'Oswald', sans-serif;
            line-height: 1.2;
            margin-bottom: 20px; /* Zmenšena mezera pod textem */
            width: 100%; /* Aby byl vycentrován */
        }

        #canvas-days-render {
            width: 100%;
            max-width: 860px; /* Původní šířka pro zachování odsazení */
            text-align: left; /* Obsah uvnitř zarovnán doleva */
        }

        .day-block {
            margin-bottom: 15px; /* Zmenšena mezera mezi dny */
            width: 100%;
            text-align: left;
        }

        .day-header {
            background-color: #d0bcab;
            display: block; /* Místo inline-block */
            width: fit-content; /* Aby pozadí bylo jen pod textem */
            padding: 3px 15px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 26px; /* Lehce zmenšeno */
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #111;
        }

        .food-item {
            font-size: 24px; /* Zmenšeno pro lepší narvání obsahu */
            color: #222;
            line-height: 1.3;
            display: flex;
            justify-content: space-between;
        }
        
        .food-soup {
            font-size: 24px;
            color: #222;
            margin-bottom: 3px;
            padding-left: 5px;
        }

        .food-meal {
            padding-left: 5px;
            flex: 1;
        }

        .food-price {
            font-weight: 500;
            text-align: right;
            min-width: 100px;
        }

        /* Number input fixes */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* App UI Styling */
        .tab-btn.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
        
        /* Kontejner pro export byl odstraněn */
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">

    <!-- Header Navigation -->
    <header class="bg-white shadow-sm z-10 relative">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i data-lucide="chef-hat" class="text-blue-600"></i>
                    <h1 class="text-xl font-bold text-gray-900">Bistro Menu</h1>
                </div>
                <div class="flex gap-4 h-full">
                    <button onclick="switchTab('editor')" id="btn-editor" class="tab-btn active px-3 flex items-center gap-2 font-medium text-gray-500 hover:text-gray-700 transition-colors h-full">
                        <i data-lucide="edit-3" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">Editor</span>
                    </button>
                    <button onclick="switchTab('preview')" id="btn-preview" class="tab-btn px-3 flex items-center gap-2 font-medium text-gray-500 hover:text-gray-700 transition-colors h-full">
                        <i data-lucide="image" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">Náhled a Export</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-hidden relative">
        
        <!-- EDITOR TAB -->
        <div id="tab-editor" class="absolute inset-0 overflow-y-auto bg-gray-50 p-4 sm:p-6 lg:p-8 transition-opacity duration-300">
            <div class="max-w-2xl mx-auto space-y-6 pb-20">
                
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-5 h-5 text-blue-500"></i>
                        Nastavení týdne
                    </h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Datum pondělí</label>
                        <input type="date" id="start-date" class="w-full sm:w-1/2 p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <div id="days-container" class="space-y-4">
                    <!-- Generováno přes JS -->
                </div>
                
                <div class="flex justify-between items-center pt-4">
                    <button onclick="clearData()" class="text-red-500 hover:bg-red-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Vymazat formulář
                    </button>
                    <button onclick="manualSave()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Uložit
                    </button>
                </div>

            </div>
        </div>

        <!-- PREVIEW & EXPORT TAB -->
        <div id="tab-preview" class="absolute inset-0 overflow-y-auto bg-gray-800 p-4 opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center">
            
            <div class="bg-white p-3 rounded-2xl shadow-xl flex flex-wrap justify-center gap-2 sm:gap-4 mb-6 sticky top-0 z-20 w-full max-w-2xl">
                <!-- Změněna ikona z instagram na download -->
                <button onclick="exportJPG()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white px-4 py-2.5 rounded-xl font-medium shadow-sm transition-all transform active:scale-95">
                    <i data-lucide="download" class="w-5 h-5"></i>
                    <span>Stáhnout JPG</span>
                </button>
                <button onclick="exportPDF()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2.5 rounded-xl font-medium transition-all transform active:scale-95">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span>PDF</span>
                </button>
                <button onclick="shareMenu()" id="btn-share" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2.5 rounded-xl font-medium transition-all transform active:scale-95">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                    <span>Sdílet na IG</span>
                </button>
            </div>

            <div id="canvas-wrapper" class="flex justify-center items-start origin-top pb-20">
                <div id="render-canvas">
                    <div class="canvas-header-bg">
                        <div class="canvas-title">Polední menu</div>
                        <img src="logo.png" alt="Logo" class="canvas-logo" onerror="this.style.display='none'">
                    </div>
                    
                    <div class="canvas-body">
                        <div class="canvas-disclaimer">
                            Změna menu vyhrazena.<br>Seznam alergenů k dispozici u obsluhy.
                        </div>
                        
                        <div id="canvas-days-render">
                            <!-- Vygenerováno přes JS -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="toast">✅ Uloženo do prohlížeče</div>
    
    <!-- Kontejner pro export byl odstraněn -->

    <script>
        lucide.createIcons();

        const DAYS = ['Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek'];
        const STORAGE_KEY = 'bistro_menu_data';

        let appState = {
            startDate: getNextMonday(),
            days: Array(5).fill(null).map((_, i) => ({
                soup: '',
                meal1: '',
                price1: '159', // Pouze číslo
                meal2: '',
                price2: '159'  // Pouze číslo
            }))
        };

        function init() {
            loadFromStorage();
            renderEditorForms();
            setupDateListener();
            updatePreview();
            handleResize();
            window.addEventListener('resize', handleResize);
            
            if (!navigator.canShare) {
                document.getElementById('btn-share').style.display = 'none';
            }
        }

        function getNextMonday() {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            return monday.toISOString().split('T')[0];
        }

        function calculateDateForDay(startDateStr, dayIndex) {
            if (!startDateStr) return '';
            const date = new Date(startDateStr);
            date.setDate(date.getDate() + dayIndex);
            return `${date.getDate()}.${date.getMonth() + 1}.`;
        }

        function setupDateListener() {
            const dateInput = document.getElementById('start-date');
            dateInput.value = appState.startDate;
            dateInput.addEventListener('change', (e) => {
                appState.startDate = e.target.value;
                autoSave();
                updateDayHeaders();
                updatePreview();
            });
        }

        function renderEditorForms() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            DAYS.forEach((dayName, index) => {
                const dayData = appState.days[index];
                const dateStr = calculateDateForDay(appState.startDate, index);

                const card = document.createElement('div');
                card.className = 'bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-gray-100 transition-all focus-within:ring-2 focus-within:ring-blue-100';
                card.innerHTML = `
                    <div class="border-b border-gray-100 pb-3 mb-4 flex justify-between items-center">
                        <h3 class="font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                            <span class="w-2 h-6 bg-blue-500 rounded-full inline-block"></span>
                            ${dayName} <span class="day-date-label text-blue-600 ml-1 font-normal">${dateStr}</span>
                        </h3>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <input type="text" placeholder="Polévka" 
                                class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800 transition-all font-medium"
                                value="${dayData.soup}" oninput="updateState(${index}, 'soup', this.value)">
                        </div>
                        <div class="flex gap-2">
                            <input type="text" placeholder="Jídlo 1" 
                                class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-700"
                                value="${dayData.meal1}" oninput="updateState(${index}, 'meal1', this.value)">
                            <div class="relative w-28">
                                <input type="number" placeholder="Cena" 
                                    class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-center focus:ring-2 focus:ring-blue-500 outline-none font-medium"
                                    value="${dayData.price1}" oninput="updateState(${index}, 'price1', this.value)">
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" placeholder="Jídlo 2" 
                                class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-700"
                                value="${dayData.meal2}" oninput="updateState(${index}, 'meal2', this.value)">
                            <div class="relative w-28">
                                <input type="number" placeholder="Cena" 
                                    class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-center focus:ring-2 focus:ring-blue-500 outline-none font-medium"
                                    value="${dayData.price2}" oninput="updateState(${index}, 'price2', this.value)">
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateDayHeaders() {
            const labels = document.querySelectorAll('.day-date-label');
            labels.forEach((label, index) => {
                label.textContent = calculateDateForDay(appState.startDate, index);
            });
        }

        function updateState(dayIndex, field, value) {
            appState.days[dayIndex][field] = value;
            autoSave();
            updatePreview();
        }

        // Pomocná funkce pro vygenerování ceny se znaky ,-
        function formatPrice(priceVal) {
            if (!priceVal) return '';
            // Odstraníme jakékoliv předchozí čárky, mínusy nebo mezery pro čisté číslo
            let cleanVal = String(priceVal).replace(/[,\-\s]/g, '');
            if (cleanVal) return `${cleanVal},-`;
            return '';
        }

        function updatePreview() {
            const container = document.getElementById('canvas-days-render');
            container.innerHTML = '';

            appState.days.forEach((dayData, index) => {
                if (!dayData.soup && !dayData.meal1 && !dayData.meal2) return;

                const dateStr = calculateDateForDay(appState.startDate, index);
                const dayName = DAYS[index].toUpperCase();

                const dayBlock = document.createElement('div');
                dayBlock.className = 'day-block';

                let html = `<div class="day-header">${dayName} ${dateStr}</div>`;
                
                if (dayData.soup) {
                    html += `<div class="food-soup">${dayData.soup}</div>`;
                }
                
                if (dayData.meal1) {
                    html += `
                    <div class="food-item">
                        <div class="food-meal">1) ${dayData.meal1}</div>
                        <div class="food-price">${formatPrice(dayData.price1)}</div>
                    </div>`;
                }

                if (dayData.meal2) {
                    html += `
                    <div class="food-item">
                        <div class="food-meal">2) ${dayData.meal2}</div>
                        <div class="food-price">${formatPrice(dayData.price2)}</div>
                    </div>`;
                }

                dayBlock.innerHTML = html;
                container.appendChild(dayBlock);
            });
        }

        let saveTimeout;
        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            }, 500);
        }

        function loadFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                    // Zpětná kompatibilita - pokud uživatel měl dříve uloženo např. "159,-", vyčistíme to zpět na číslo
                    appState.days.forEach(day => {
                        if (day.price1) day.price1 = String(day.price1).replace(/[,\-\s]/g, '');
                        if (day.price2) day.price2 = String(day.price2).replace(/[,\-\s]/g, '');
                    });
                } catch (e) {
                    console.error("Failed to parse saved data", e);
                }
            }
        }

        function manualSave() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            showToast();
        }

        function clearData() {
            appState.days = Array(5).fill(null).map(() => ({
                soup: '', meal1: '', price1: '159', meal2: '', price2: '159'
            }));
            renderEditorForms();
            updatePreview();
            autoSave();
            showToast("Formulář vymazán");
        }

        function showToast(msg = "✅ Uloženo do prohlížeče") {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function switchTab(tabName) {
            const editorTab = document.getElementById('tab-editor');
            const previewTab = document.getElementById('tab-preview');
            const btnEditor = document.getElementById('btn-editor');
            const btnPreview = document.getElementById('btn-preview');

            if (tabName === 'editor') {
                editorTab.style.opacity = '1';
                editorTab.style.pointerEvents = 'auto';
                previewTab.style.opacity = '0';
                previewTab.style.pointerEvents = 'none';
                btnEditor.classList.add('active');
                btnPreview.classList.remove('active');
            } else {
                editorTab.style.opacity = '0';
                editorTab.style.pointerEvents = 'none';
                previewTab.style.opacity = '1';
                previewTab.style.pointerEvents = 'auto';
                btnEditor.classList.remove('active');
                btnPreview.classList.add('active');
                
                document.fonts.ready.then(() => {
                    handleResize(); 
                });
            }
        }

        function handleResize() {
            const canvas = document.getElementById('render-canvas');
            const wrapper = document.getElementById('canvas-wrapper');
            const containerWidth = wrapper.parentElement.clientWidth - 32;
            
            let scale = containerWidth / 1080;
            if (scale > 1) scale = 1;
            if (scale < 0.2) scale = 0.2;

            canvas.style.transform = `scale(${scale})`;
            wrapper.style.height = `${1350 * scale}px`;
        }

        // NOVÁ FUNKCE PRO EXPORT - "Snímek" aktuálního náhledu
        async function createExportImage() {
            const canvasElement = document.getElementById('render-canvas');
            
            // Přímo vyfotíme to, co je na obrazovce (ve zmenšené podobě)
            const canvas = await html2canvas(canvasElement, {
                scale: 1.5, // Mírné zvýšení kvality
                useCORS: true,
                logging: false,
                backgroundColor: '#e4dfd6',
                scrollY: -window.scrollY // Kritická oprava pro správné oříznutí při skrolu
            });
            return canvas;
        }

        async function exportJPG() {
            showToast("⏳ Generuji obrázek...");
            try {
                // Počkáme na vytvoření canvasu
                const canvas = await createExportImage();
                
                // Vytvoříme odkaz ke stažení
                const link = document.createElement('a');
                link.download = `menu-${appState.startDate}.jpg`;
                // Převedeme canvas na JPG data URL s kvalitou 0.9
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            } catch (error) {
                console.error("Chyba při exportu JPG:", error);
                showToast("❌ Chyba při exportu JPG");
            }
        }

        async function exportPDF() {
            showToast("⏳ Generuji PDF...");
            try {
                // Počkáme na vytvoření canvasu
                const canvas = await createExportImage();
                // Převedeme canvas na JPG data URL s kvalitou 0.9
                const imgData = canvas.toDataURL('image/jpeg', 0.9);
                
                const { jsPDF } = window.jspdf;
                // POUŽIJEME VLASTNÍ VELIKOST STRÁNKY PODLE CANVASU (aby se nic neuseklo)
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height] // Nastaví velikost stránky přesně podle rozměrů obrázku
                });
                
                // Vložíme obrázek do PDF
                pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
                pdf.save(`menu-${appState.startDate}.pdf`);
            } catch (error) {
                console.error("Chyba při exportu PDF:", error);
                showToast("❌ Chyba při exportu PDF");
            }
        }

        async function shareMenu() {
            showToast("⏳ Připravuji obrázek pro sdílení...");
            try {
                const canvas = await createExportImage();
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        showToast("❌ Chyba při tvorbě obrázku");
                        return;
                    }
                    
                    const file = new File([blob], `menu-${appState.startDate}.jpg`, { type: 'image/jpeg' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Polední menu',
                                text: 'Naše polední menu na tento týden!'
                            });
                        } catch (e) {
                            if (e.name !== 'AbortError') {
                                console.error('Share error:', e);
                                showToast("❌ Sdílení se nezdařilo");
                            }
                        }
                    } else {
                        showToast("❌ Váš prohlížeč nepodporuje přímé sdílení. Stáhněte si JPG.");
                    }
                }, 'image/jpeg', 0.9);
            } catch (error) {
                console.error(error);
                showToast("❌ Chyba při sdílení");
            }
        }

        init();

    </script>
</body>
</html>
